name: Mobile portfolio layout
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  mobile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/build49_ai_cache.mjs
      - run: node tests/build49c_ai_error.mjs
      - run: node tests/build49d_ai_readability.mjs
      - run: node tests/build49_mobile_visual.mjs
      - run: node tests/build49d_ai_mobile.mjs
      - run: node tests/build50_decision_metrics.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-portfolio-screenshots
          path: mobile-artifacts/*.png
          if-no-files-found: ignore
