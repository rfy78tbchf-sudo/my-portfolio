name: Mobile portfolio layout
on:
  push:
    branches: [main, 'work/performance-*']
  workflow_dispatch:
jobs:
  decision-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify detail history sharing does not cache completed results
        run: node tests/build234_read_sharing.mjs
      - name: Verify update manifest matches HTML and cached shell
        run: node tests/build72_app_update.mjs
      - name: Verify saved decisions and next-visit review
        run: >-
          node --test
          tests/build157_decision_receipt.mjs
          tests/build158_review_consistency.mjs
          tests/build159_decision_changes.mjs
          tests/build162_quick_review.mjs
          tests/build179_review_acknowledgements.mjs
          tests/build191_review_entry.mjs
          tests/build193_review_reload.mjs
      - name: Verify daily access, retained performance and return actions
        run: >-
          node --test
          tests/build209_resume.mjs
          tests/build209_performance_refresh.mjs
          tests/build209_next_review.mjs
          tests/build209_touch_return.mjs
          tests/build209_shell_recovery.mjs
      - name: Verify provisional amounts and reconciliation scope
        run: node --test tests/build210_pnl_state.mjs
      - name: Verify automatic wealth, projections and milestone calculations
        run: node tests/build226_wealth.mjs
      - name: Verify daily five-day moving average crossings
        run: node tests/build224_ma_cross.mjs
      - name: Verify on-demand refresh data and isolation
        run: node tests/build216_refresh.mjs
      - name: Verify early assets and staged loading
        run: node tests/build215_startup.mjs
      - name: Verify asset composition and home separation
        run: node tests/build214_asset_map.mjs
      - name: Verify interrupted decision submission and persisted request identity
        run: node --test tests/decision_edit_prefill.mjs tests/build211_pending_decision.mjs tests/build211_review_race.mjs
  mobile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.55.1 @fontsource/noto-sans-kr@5.3.0
      - run: npx playwright install --with-deps chromium webkit
        timeout-minutes: 5
      - name: Verify saved detail history sharing and fresh reopening
        run: node tests/build234_detail_reads.mjs --verify
      - name: Verify chart window reuse preserves selection and new prices
        run: node tests/build233_chart_latency.mjs --verify
      - name: Verify cold and warm update checks with real service workers
        run: node tests/build232_update_latency.mjs --verify
      - name: Verify wealth only requests visible data and reuses cached results
        run: node tests/build231_wealth_latency.mjs --verify
      - name: Verify lazy Excel parsing, shared loading and retry
        run: node tests/build230_lazy_xlsx.mjs
      - name: Verify automatic wealth, scenarios, retry and mobile layout
        run: node tests/build226_browser.mjs
      - name: Verify moving average crossing display in both browsers
        run: node tests/build224_ma_cross.mjs --browser
      - name: Verify on-demand crossing focus and restore in both browsers
        run: node tests/build225_cross_focus.mjs
      - name: Verify position and saved judgment entry
        run: node tests/build217_browser.mjs
      - run: node tests/build49_ai_cache.mjs
      - run: node tests/build49c_ai_error.mjs
      - run: node tests/build49d_ai_readability.mjs
      - run: node tests/build57c_ai_history.mjs
      - run: node tests/build49_mobile_visual.mjs
      - run: node tests/build49d_ai_mobile.mjs
      - run: node tests/build50_decision_metrics.mjs
      - run: node tests/build50c_account_scope.mjs
      - run: node tests/build51_account_realized_scenario.mjs
      - run: node tests/build52_current_isa.mjs
      - run: node tests/build53_isa_upload.mjs
      - run: node tests/build53_isa_mobile.mjs
      - run: node tests/build54_realized_ai_flow.mjs
      - run: node tests/build54a_isa_correction.mjs
      - run: node tests/build55_domestic_charge.mjs
      - run: node tests/build54_mobile.mjs
      - run: node tests/build57_decision_journey.mjs
      - run: node tests/build203_risk_budget.mjs
      - run: node tests/build57d_choice_decision.mjs
      - run: node tests/comparison_target_clear.mjs
      - run: node tests/detail_ready.mjs
      - run: node tests/comparison_current_weight.mjs
      - run: node tests/decision_edit_prefill.mjs
      - run: node tests/manual_review_conditions.mjs
      - run: node tests/build57_decision_mobile.mjs
      - run: node tests/build57d_detail_mobile.mjs
      - run: node tests/build58_review_evidence.mjs
      - run: node tests/build58_kr_official_evidence.mjs
      - run: node tests/build59_decision_flow.mjs
      - run: node tests/build59e_price_thesis_opinion.mjs
      - run: node tests/build60_reading_order_mobile.mjs
      - run: node tests/build61_period_journey.mjs
      - run: node tests/build63_journey.mjs
      - run: node tests/build64a_unconfirmed_close.mjs
      - run: node tests/build65_decision_completion.mjs
      - name: Verify refresh completion and lazy data in both browsers
        run: node tests/build216_browser.mjs
      - name: Verify early assets, refresh failure and retry in both browsers
        run: node tests/build215_browser.mjs
      - run: node tests/build67_ui_visual.mjs
      - run: UI_WEBKIT_NAV=1 UI_OUTPUT=mobile-artifacts/webkit-navigation node tests/build67_ui_visual.mjs
      - name: Verify daily journey with production login and data-loading paths
        run: node tests/build209_daily_browser.mjs
      - name: Verify home asset map and portfolio selection
        run: node tests/build214_browser.mjs
      - name: Verify trend period continuity
        run: node tests/build210_trend_browser.mjs
      - name: Verify detail actions during text entry and control selection
        run: node tests/build210_detail_controls.mjs
      - name: Verify decision save, interrupted receipt and next-visit readback
        run: node tests/build211_decision_browser.mjs
      - run: node tests/build90_chart_ma.mjs --browser
      - run: node tests/build93_review_conditions.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-portfolio-screenshots
          path: mobile-artifacts/**/*.png
          if-no-files-found: ignore
