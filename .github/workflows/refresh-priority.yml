name: Period refresh priority comparison
on:
  push:
    branches: ['work/performance-*']
    paths:
      - tests/refresh_critical_path253.mjs
      - tests/refresh_priority_compare253.mjs
      - .github/workflows/refresh-priority.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.55.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Compare alternating versions with correct-result paint and request counts
        run: node tests/refresh_priority_compare253.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: period-refresh253
          path: mobile-artifacts/refresh253/
