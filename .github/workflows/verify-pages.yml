name: Verify deployed Pages markers
on:
  push:
    branches: ['work/performance-*']
    paths: ['.github/workflows/verify-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify live Build251 HTML, manifest and service worker
        shell: python
        run: |
          import json, time, urllib.request
          base = "https://rfy78tbchf-sudo.github.io/my-portfolio/"
          expected = "2026-11-09-period-reconciliation-251"
          shell = "my-portfolio-shell-2026110904-251"
          for attempt in range(6):
              try:
                  def read(path):
                      req = urllib.request.Request(base + path + "?verify=" + str(time.time_ns()), headers={"Cache-Control": "no-cache"})
                      with urllib.request.urlopen(req, timeout=15) as response:
                          assert response.status == 200
                          return response.read().decode("utf-8")
                  version = json.loads(read("version.json"))
                  html = read("index.html")
                  worker = read("sw.js")
                  assert expected in version.values(), version
                  assert "<!-- build: " + expected + " -->" in html
                  assert "var appBuild='" + expected + "'" in html
                  assert shell in worker
                  print("LIVE_PAGES_VERIFIED", expected, shell)
                  break
              except Exception:
                  if attempt == 5:
                      raise
                  time.sleep(10)
