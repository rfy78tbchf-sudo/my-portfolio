<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Portfolio · 세 가지 시작 화면</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:#17212b;font-family:system-ui,-apple-system,sans-serif}button,select,textarea{font:inherit}button{cursor:pointer;min-height:44px;border:0;border-radius:12px;padding:10px 14px;color:inherit;background:#f0f3f6}button:focus-visible{outline:3px solid #188477}header{max-width:1240px;margin:auto;padding:24px}h1{font-size:24px}p{line-height:1.6}.compare{display:flex;gap:24px;max-width:1240px;margin:auto;overflow:auto;padding:0 16px 32px;scroll-snap-type:x mandatory}.variant{flex:0 0 390px;scroll-snap-align:center}.intro{height:140px;padding:0 8px}.intro h2{font-size:20px;margin:10px 0}.intro p{font-size:14px;color:#526172;margin:6px 0}.phone{height:844px;overflow:auto;background:white;border-radius:24px;position:relative;box-shadow:0 8px 30px #14283e12}.chrome{padding:18px 20px 6px;display:flex;justify-content:space-between;font-size:14px}.screen{padding:16px 20px 30px}.eyebrow{color:#637181;font-size:14px}.asset{font-size:36px;font-weight:750;letter-spacing:-1.5px;margin:8px 0}.periods{display:flex;gap:4px;margin:16px 0 10px}.periods span{flex:1;text-align:center;background:#f6f7f9;padding:12px 0;font-size:13px;border-radius:24px}.periods .selected{background:#17212b;color:white}.change{font-size:18px;margin:10px 0;color:#e83e5e;font-weight:650}.hint{font-size:13px;color:#637181;margin:8px 0}.chart{width:100%;height:136px;display:block}.dates{display:flex;justify-content:space-between;font-size:12px;color:#637181}.section-head{display:flex;align-items:center;justify-content:space-between;margin:24px 0 8px}.section-head h3{font-size:20px;margin:0}.map{display:grid;grid-template-columns:5fr 4fr;grid-template-rows:minmax(0,3fr) minmax(0,1fr);height:240px;gap:5px}.map button{border-radius:8px;text-align:left;background:#d9ece7}.map button:first-child{grid-row:span 2;background:#b8dcd1}.map button:last-child{background:#e9edf2}.map small{display:block;margin-top:6px}.list{display:grid;gap:0}.list button{display:flex;justify-content:space-between;align-items:center;text-align:left;border-radius:0;border-bottom:1px solid #edf0f3;background:white}.list small{display:block;color:#637181;font-size:13px;margin-top:5px}.focus{background:#f5f8f7;border-radius:18px;padding:20px}.focus h3{margin:8px 0;font-size:22px}.focus p{margin:10px 0}.primary{background:#137c6e;color:white;width:100%;font-weight:600}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}.timeline{border-left:2px solid #dce8e4;padding-left:18px;margin-left:5px}.event{margin:20px 0}.event b{display:block;margin:8px 0}.event p{font-size:14px}.nav{display:flex;justify-content:space-around;padding:16px 8px;background:#fff;border-top:1px solid #edf0f3;font-size:13px}.detail{background:white;position:absolute;inset:0;min-height:844px;padding:20px;z-index:3;overflow:auto}.detail[hidden]{display:none}.detail h2{margin:24px 0 8px}.detail label{display:block;margin-top:18px;font-size:14px}.detail textarea,.detail select{width:100%;padding:12px;margin-top:8px;border:1px solid #ccd5de;border-radius:10px;min-height:48px}.detail textarea{min-height:90px}.saved{color:#137c6e}.badge{font-size:12px;color:#137c6e}a{color:#137c6e}@media(max-width:450px){header{padding:16px}.variant{flex-basis:calc(100vw - 32px)}.phone{border-radius:16px}.asset{font-size:34px}}
</style>
<header><h1>내 자산에서 내 판단까지</h1><p>세 화면 모두 같은 가상 계좌 · 390 × 844 · 최근 1개월. 실계좌와 연결되지 않은 비교 시안입니다.</p></header>
<main class="compare" id="concepts"></main>
<script>
const names=['오로라 테크','한빛 글로벌 ETF','푸른 에너지'];const values=['12,000,000원','7,200,000원','2,400,000원'];const ratios=[50,30,10];
const descriptions=[['A · 자산 지도','전체 구성 → 비중 선택 → 같은 화면에서 판단','구성 파악이 빠름 · 작은 종목은 목록으로 보완'],['B · 종목 점검','자산 확인 → 한 종목 검토 → 저장 또는 다음 종목','추천 · 한 손으로 이어 보기 편함 · 전체 비교는 목록에서'],['C · 판단의 시간 흐름','지난 판단 → 확인된 변화 → 새 판단','보유 이유 복기에 좋음 · 기록이 적으면 목록으로 시작']];
const chart='<svg class="chart" viewBox="0 0 350 136" role="img" aria-label="가상 자산: 2376만원에서 2400만원으로 증가"><path d="M0 110L35 94L70 99L105 67L140 77L175 57L210 64L245 32L280 40L315 18L350 21L350 136L0 136Z" fill="#ee435f0a"/><path d="M0 110L35 94L70 99L105 67L140 77L175 57L210 64L245 32L280 40L315 18L350 21" fill="none" stroke="#ee435f" stroke-width="3"/></svg>';
const common='<div class="eyebrow">내 자산</div><div class="asset">24,000,000원</div><div class="hint">가상 계좌 · 원화</div><div class="periods"><span>1주</span><span class="selected">1개월</span><span>3개월</span><span>전체</span></div><div class="change">자산 변화 +240,000원</div><div class="hint">입출금 포함</div>'+chart+'<div class="dates"><span>9. 20.</span><span>10. 20.</span></div>';
function rows(){return '<div class="list">'+names.map((n,i)=>'<button data-open="'+i+'"><span>'+n+'<small>'+ratios[i]+'%</small></span><span>'+values[i]+' ›</span></button>').join('')+'</div>'}
descriptions.forEach((d,v)=>{let section=document.createElement('section');section.className='variant';section.innerHTML='<div class="intro"><h2>'+d[0]+'</h2><p>'+d[1]+'</p><p>'+d[2]+'</p></div><div class="phone"><div class="chrome"><b>My Portfolio</b><span>가상 시안</span></div><div class="screen">'+common+(v===0?'<div class="section-head"><h3>자산 지도</h3><span class="hint">현금 10%</span></div><div class="map">'+names.map((n,i)=>'<button data-open="'+i+'">'+n+'<small>'+ratios[i]+'%</small></button>').join('')+'</div>'+rows():v===1?'<div class="section-head"><h3>종목 점검</h3><span class="badge">탐색 위치 유지</span></div><div class="focus" id="focus"></div><details><summary style="padding:18px 0">목록에서 고르기</summary>'+rows()+'</details>':'<div class="section-head"><h3>내 판단</h3><span class="hint">최신순</span></div><div class="timeline"><div class="event"><span class="hint">10. 20. · 오로라 테크</span><b>다시 볼 날짜가 됐어요</b><p>10. 1. 유지 · “다음 실적 발표에서 성장 확인”<br>확인 가능한 변화: 저장한 날짜 도달</p><button data-open="0">지난 판단 이어 보기 ›</button></div><div class="event"><span class="hint">10. 5. · 한빛 글로벌 ETF</span><b>유지 · 장기 분산 투자</b><button data-open="1">판단 다시 보기 ›</button></div></div><details><summary style="padding:18px 0">아직 기록하지 않은 종목</summary><button data-open="2">푸른 에너지 · 첫 판단 남기기</button></details>')+'</div><div class="nav"><b>자산</b><span>내 종목</span><span>손익</span><span>더보기</span></div><section class="detail" hidden></section></div>';document.getElementById('concepts').append(section);let cursor=0;function focus(){section.querySelector('#focus').innerHTML='<div class="hint">'+(cursor+1)+' / 3 · 탐색 순서</div><h3>'+names[cursor]+'</h3><b>'+values[cursor]+'</b><p class="hint">'+(cursor===0?'지난 판단: 유지 · 다시 볼 날짜 도달':cursor===1?'지난 판단: 유지 · 장기 분산 투자':'첫 판단을 남겨 보세요')+'</p><button class="primary" data-open="'+cursor+'">종목 검토하기</button><div class="actions"><button data-next>다음 종목 →</button></div>'}if(v===1)focus();section.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-next')){cursor=(cursor+1)%3;focus();return}const detail=section.querySelector('.detail');if(b.hasAttribute('data-close')){detail.hidden=true;return}if(b.hasAttribute('data-save')){const reason=detail.querySelector('textarea').value.trim();if(!reason){detail.querySelector('textarea').focus();return}detail.querySelector('.result').textContent='시안 안에서 저장됨 · 실계좌 기록 없음';b.textContent='시안 저장 완료';b.disabled=true;return}if(b.hasAttribute('data-open')){cursor=Number(b.dataset.open);if(v===1)focus();detail.innerHTML='<button data-close>← 목록으로</button><h2>'+names[cursor]+'</h2><p>'+values[cursor]+' · '+ratios[cursor]+'%</p><div class="focus"><b>'+(cursor===2?'첫 판단':'현재 판단 · 유지')+'</b><p>'+(cursor===0?'보유 이유: 다음 실적에서 성장 확인':cursor===1?'보유 이유: 장기 분산 투자':'보유 이유를 적어 보세요')+'</p></div><label>내 판단<select><option>유지</option><option>일부 축소 검토</option><option>추가 확인</option></select></label><label>이유<textarea placeholder="판단 이유를 적어 주세요"></textarea></label><label>다시 볼 조건<textarea placeholder="예: 다음 실적 발표 후"></textarea></label><button class="primary" style="margin-top:20px" data-save>판단 저장 · 시안</button><p class="result saved" role="status"></p><button data-close>목록으로</button>';detail.hidden=false;section.querySelector('.phone').scrollTop=0}})});
</script></html>
