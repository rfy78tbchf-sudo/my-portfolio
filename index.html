  function loadSwingPrices(target){
    target.swingPrices={};
    var ids=Array.from(new Set((target.holdings||[]).filter(function(h){return Number(h.quantity)>0}).map(function(h){return h.security_id}))),next=0;
    function worker(){var id=ids[next++];if(!id)return Promise.resolve();
      return rest('daily_security_prices?select=price_date,close,currency&security_id=eq.'+encodeURIComponent(id)+'&order=price_date.desc&limit=160').then(function(rows){
        target.swingPrices[id]=(rows||[]).slice().reverse().map(function(q){return {date:q.price_date,close:q.close,currency:q.currency}});
      }).catch(function(){target.swingPrices[id]=[]}).then(worker);
    }
    return Promise.all([worker(),worker(),worker()]).then(function(){if(target===live){updateSwingAlerts(target);if(typeof mode!=='undefined'&&mode==='live')render(true)}});
  }
  function reduceSwingAlerts(previous,observations,held){
    var state={},events=[];
    held.forEach(function(id){var old=previous&&previous[id];if(old&&typeof old.date==='string'&&/^20\d\d-\d\d-\d\d$/.test(old.date)&&typeof old.peakKey==='string'&&typeof old.active==='boolean')state[id]=Object.assign({},old)});
    observations.forEach(function(t){
      var old=state[t.id],peakKey=t.peak.date+':'+t.peak.close+':'+t.currency;
      if(old&&t.date<old.date)return;
      var below=t.drawdown<=-15,newEvent=below&&(!old||t.date>old.date&&(!old.active||old.peakKey!==peakKey));
      var item={date:t.date,peakKey:peakKey,active:below,eventKey:old&&old.eventKey||'',unread:old&&old.unread||false};
      if(newEvent){item.eventKey=t.id+':'+peakKey+':'+t.date;item.unread=true;events.push(t)}
      state[t.id]=item;
    });
    return {state:state,events:events};
  }

  function homePriceWatchData(){
    var held=Array.from(new Set(((live&&live.holdings)||[]).filter(function(h){return Number(h.quantity)>0}).map(function(h){return h.security_id}))),
      today=Date.parse(kstDate()+'T00:00:00Z'),checked=0,alerts=[],pending=[],forming=[],observations=[];
    held.forEach(function(id){
      var s=live.securityMap&&live.securityMap[id],points=live.swingPrices&&live.swingPrices[id];
      function wait(reason,list){(list||pending).push({id:id,name:s&&(s.name||s.symbol)||'종목 확인 필요',symbol:s&&s.symbol||'',reason:reason,open:!!s})}
      if(!s){wait('종목 정보 확인 필요');return}if(!points||!points.length){wait('가격 자료 없음');return}
      var last=points[points.length-1],age=(today-Date.parse(last.date+'T00:00:00Z'))/86400000;
      if(!Number.isFinite(age)||age<0){wait('가격 날짜 확인 필요');return}if(age>7){wait('최근 가격 갱신 필요');return}
      var peak=recentSwingPeak(points,s.currency);if(peak.state!=='confirmed'){wait(peak.state==='broken'?'이전 전고점 돌파 후 형성 중':peak.state==='pending'?'확정된 전고점 없음':'가격 자료 확인 필요',peak.state==='broken'||peak.state==='pending'?forming:pending);return}
      checked++;
      var observation={id:id,name:s.name||s.symbol,symbol:s.symbol,date:last.date,drawdown:peak.drawdown,peak:peak,currency:s.currency};observations.push(observation);
      if(peak.drawdown<=-15)alerts.push(observation);
    });
    alerts.sort(function(a,b){return a.drawdown-b.drawdown||String(a.id).localeCompare(String(b.id))});
    return {total:held.length,checked:checked,unknown:pending.length,alerts:alerts,pending:pending,forming:forming,observations:observations};
  }

  function runRefreshSync(onStep,full){
    var errors=[],steps=[{action:'sync-current',label:'KB 잔고',payload:{}}];
    if(full)recentHistoryMonths().forEach(function(month){steps.push({action:'sync-history-month',label:month+' 거래내역',payload:{month:month}})});
    if(full)steps.push({action:'sync-prices',label:'가격·환율',payload:{}});
    return steps.reduce(function(tail,step){return tail.then(function(){
      if(onStep)onStep(step.label);
      return edgeSync(step.action,step.payload).catch(function(){errors.push(step.label)});
    })},Promise.resolve()).then(function(){return errors});

    steps.push({key:'prices',action:'sync-prices',payload:{},ttl:3600000});
    var activeKeys=steps.map(function(s){return s.key});
    Object.keys(backgroundSyncTimes).forEach(function(key){if(activeKeys.indexOf(key)<0)delete backgroundSyncTimes[key]});
    steps=steps.filter(function(s){return now-(backgroundSyncTimes[s.key]||0)>=s.ttl});
    if(!steps.length)return Promise.resolve();
    var active=function(){return mode==='live'&&session&&session.refreshToken===owner};
    var badge=document.getElementById('modeBadge');if(badge)badge.textContent='내역 갱신 중';
