globalThis.__MY_PORTFOLIO_EDGE__={
  configUrl:'./__inline_config_not_needed__.json',

  serviceWorkerScope:'./'
};

const SESSION_KEY = 'my_portfolio_session_v1';
const EDGE_RUNTIME = globalThis.__MY_PORTFOLIO_EDGE__ || {};

function currentAppRoot() {
  return `${location.origin}${location.pathname}`;
}

function readStoredSession() {
  try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch { return null; }
}

function writeSession(session) {
  if (!session) localStorage.removeItem(SESSION_KEY);
  else localStorage.setItem(SESSION_KEY, JSON.stringify(session));
}

async function getRuntimeConfig() {
  try {
    const response = await fetch(EDGE_RUNTIME.configUrl || '/api/config', { headers: { accept: 'application/json' } });
    if (!response.ok) throw new Error('config unavailable');
    return await response.json();
  } catch {
    return { appName:'My Portfolio', requireAuth:true, supabaseUrl:'https://buimrsjowlmfkxxaithj.supabase.co', supabasePublishableKey:'sb_publishable_PtqyNbOvFTVbPwtwZB6-rQ_bbzKHZfv', demoEnabled:true, timezone:'Asia/Seoul', kbStatusUrl:EDGE_RUNTIME.kbStatusUrl || '/api/kb/status', authRedirectUrl:currentAppRoot() };
  }
}

function consumeMagicLinkHash() {
  const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  const accessToken = hash.get('access_token');
  const refreshToken = hash.get('refresh_token');
  if (!accessToken) return null;
  const expiresIn = Number(hash.get('expires_in') || 3600);
  const session = { accessToken, refreshToken, expiresAt: Date.now() + expiresIn * 1000 };
  writeSession(session);
  history.replaceState(null, '', location.pathname + location.search);
  return session;
}

async function refreshSession(config, session) {
  if (!session?.refreshToken || !config.supabaseUrl || !config.supabasePublishableKey) return null;
  const response = await fetch(`${config.supabaseUrl}/auth/v1/token?grant_type=refresh_token`, {
    method:'POST',
    headers:{ 'content-type':'application/json', apikey:config.supabasePublishableKey },
    body:JSON.stringify({ refresh_token:session.refreshToken }),
  });
  if (!response.ok) { writeSession(null); return null; }
  const body = await response.json();
  const next = {
    accessToken:body.access_token,
    refreshToken:body.refresh_token || session.refreshToken,
    expiresAt:Date.now() + Number(body.expires_in || 3600) * 1000,
  };
  writeSession(next);
  return next;
}

async function currentSession(config) {
  const fromHash = consumeMagicLinkHash();
  let session = fromHash || readStoredSession();
  if (!session) return null;
  if (Date.now() > Number(session.expiresAt || 0) - 60_000) session = await refreshSession(config, session);
  return session;
}

async function requestMagicLink(config, email) {
  if (!config.supabaseUrl || !config.supabasePublishableKey) throw new Error('로그인 서버가 아직 연결되지 않았습니다.');
  const endpoint = new URL(`${config.supabaseUrl}/auth/v1/otp`);
  endpoint.searchParams.set('redirect_to', config.authRedirectUrl || currentAppRoot());
  const response = await fetch(endpoint, {
    method:'POST',
    headers:{ 'content-type':'application/json', apikey:config.supabasePublishableKey },
    body:JSON.stringify({ email, create_user:true }),
  });
  if (!response.ok) {
    const body = await response.json().catch(()=>({}));
    throw new Error(body?.msg || body?.message || '로그인 링크 전송에 실패했습니다.');
  }
  return true;
}

async function supabaseRest(config, session, path, { method='GET', body, headers={} }={}) {
  if (!session?.accessToken) throw new Error('auth_required');
  const response = await fetch(`${config.supabaseUrl}/rest/v1/${path}`, {
    method,
    headers:{ apikey:config.supabasePublishableKey, Authorization:`Bearer ${session.accessToken}`, 'content-type':'application/json', ...headers },
    body:body == null ? undefined : JSON.stringify(body),
  });
  if (!response.ok) throw new Error(`data_api_${response.status}`);
  if (response.status===204) return null;
  return response.json();
}

function sma(values, period) {
  if (!Array.isArray(values) || values.length < period || period <= 0) return null;
  return values.slice(-period).reduce((a,b)=>a+Number(b||0),0)/period;
}
function emaSeries(values, period) {
  if (!values.length) return [];
  const k=2/(period+1); const out=[Number(values[0])];
  for(let i=1;i<values.length;i++) out.push(Number(values[i])*k+out[i-1]*(1-k));
  return out;
}
function rsi(values, period=14) {
  if(values.length<=period) return null;
  let gain=0, loss=0;
  for(let i=values.length-period;i<values.length;i++){
    const d=Number(values[i])-Number(values[i-1]); if(d>0) gain+=d; else loss-=d;
  }
  if(loss===0) return 100;
  const rs=(gain/period)/(loss/period); return 100-100/(1+rs);
}
function macd(values, fast=12, slow=26, signal=9) {
  if(values.length<slow+signal) return null;
  const f=emaSeries(values,fast), s=emaSeries(values,slow);
  const line=values.map((_,i)=>f[i]-s[i]);
  const sig=emaSeries(line,signal); const i=line.length-1;
  return { value:line[i], signal:sig[i], histogram:line[i]-sig[i] };
}
function annualizedVolatility(values, tradingDays=252) {
  if(values.length<3) return null;
  const returns=[];
  for(let i=1;i<values.length;i++) if(values[i-1]) returns.push(values[i]/values[i-1]-1);
  const mean=returns.reduce((a,b)=>a+b,0)/returns.length;
  const variance=returns.reduce((a,b)=>a+(b-mean)**2,0)/(returns.length-1);
  return Math.sqrt(variance)*Math.sqrt(tradingDays);
}
function technicalSnapshot(history) {
  const closes=history.map(x=>Number(x.close));
  const vols=history.map(x=>Number(x.volume||0));
  const price=closes.at(-1) || 0;
  const high52=Math.max(...closes.slice(-252));
  const low52=Math.min(...closes.slice(-252));
  const m={20:sma(closes,20),60:sma(closes,60),120:sma(closes,120),200:sma(closes,200)};
  const rsi14=rsi(closes,14); const mcd=macd(closes);

  const hs=liveHoldingModels();if(!state.liveData?.accounts?.length)return `<div class="section-title">분석</div>${empty('분석할 Live 데이터가 없습니다','계좌 연결 후 실제 보유종목만 기준으로 집중도와 기술적 추세를 계산합니다.')}`;if(!hs.length)return `<div class="section-title">분석</div>${empty('보유종목 데이터가 없습니다','현금만 있거나 아직 첫 보유종목 동기화가 완료되지 않았습니다.')}`;
  const groups={};for(const h of hs)groups[h.sector]=(groups[h.sector]||0)+h.weight;const sorted=hs.slice().sort((a,b)=>b.weight-a.weight),concentration=sorted.slice(0,5).reduce((s,h)=>s+h.weight,0);const korea=hs.filter(h=>h.region==='한국').reduce((s,h)=>s+h.weight,0),us=hs.filter(h=>h.region==='미국').reduce((s,h)=>s+h.weight,0);
  return `<div class="section-title">분석</div><div class="grid desktop-2"><section class="card"><h3>국가·집중도</h3>${barRow('한국',korea)}${barRow('미국',us)}<div class="summary-row"><span>Top 5 집중도</span><strong>${concentration.toFixed(1)}%</strong></div><div class="summary-row"><span>최대 종목</span><strong>${esc(sorted[0].name)} ${sorted[0].weight.toFixed(1)}%</strong></div><div class="notice">집중도는 위험 정보이며 매수·매도 권고가 아닙니다.</div></section><section class="card"><h3>업종 비중</h3>${Object.entries(groups).sort((a,b)=>b[1]-a[1]).map(([a,b])=>barRow(a,b)).join('')}</section></div><section class="card topgap"><h3>보유종목 기술적 추세</h3>${hs.map(liveHoldingTrendRow).join('')}</section>`
}

function transactionRows(){return transactions().slice(0,12).map(t=>`<button class="summary-row txrow" data-tx="${t.id}"><span><b>${t.date.slice(5)} · ${esc(t.name)}</b><small>${t.type} · ${t.source==='manual'?'수동':'자동'}</small></span><span class="${cls(t.amount)}">${money(t.amount)}</span></button>`).join('')}
function more(){return `<div class="section-title">더보기</div><div class="grid"><section class="card"><div class="row between"><div><h3 style="margin-bottom:4px">동기화</h3><div class="sub">마지막 정상 동기화 · ${state.demo?'Demo':(state.liveData?.syncLogs?.find(x=>x.status==='success'||x.status==='partial')?.finished_at||'아직 없음')}</div></div><button class="btn secondary" id="refresh">새로고침</button></div><div id="syncMsg" class="notice topgap">${state.demo?'Demo에서는 로컬 샘플만 갱신합니다.':'KB 조회 실패 시 마지막 정상 DB 데이터를 유지합니다.'}</div><div class="summary-row"><span>자동 동기화</span><div class="switch ${state.autoSync?'on':''}" id="syncSwitch"><i></i></div></div></section>
  <section class="card"><div class="row between"><h3 style="margin:0">거래내역</h3><button class="softbtn" id="addTx">+ 수동 기록</button></div><div id="txList">${transactionRows()}</div></section>
  <section class="card"><h3>표시 설정</h3><label class="settingsrow"><span>앱 이름</span><input class="miniinput" id="appName" value="${esc(localStorage.appName||state.config?.appName||'My Portfolio')}"></label><div class="summary-row"><span>기준 통화</span><button class="btn secondary" id="currency">${state.currency}</button></div><div class="summary-row"><span>큰 금액 간단히</span><div class="switch ${state.compact?'on':''}" id="compactSwitch"><i></i></div></div><div class="summary-row"><span>다크 모드</span><div class="switch ${state.theme==='dark'?'on':''}" id="themeSwitch"><i></i></div></div><div class="summary-row"><span>상승/하락 색상</span><button class="btn secondary" id="colors">${state.colors==='kr'?'한국식':'글로벌'}</button></div></section>
  <section class="card"><h3>백업·이동</h3><div class="actiongrid"><button class="btn secondary" id="exportJson">JSON 백업</button><button class="btn secondary" id="exportCsv">거래 CSV</button><button class="btn secondary" id="importJson">JSON 가져오기</button><button class="btn secondary danger" id="resetData">수동 데이터 초기화</button></div><input type="file" id="fileInput" accept="application/json" hidden></section>
  <section class="card"><h3>KB증권 연결</h3><div class="notice">App Key/App Secret과 토큰은 서버에서만 관리합니다. 주문·취소·정정 API는 등록하지 않습니다.</div><button class="btn topgap" id="kbtest">연결 상태 확인</button><div id="kbmsg" class="sub topgap"></div></section>
  ${state.session?`<section class="card"><div class="row between"><div><h3 style="margin-bottom:4px">보안</h3><div class="sub">이메일 인증 세션으로 접속 중</div></div><button class="btn secondary" id="signout">로그아웃</button></div></section>`:''}</div>`}

function nav(){const tabs=[['home','⌂','홈'],['portfolio','◫','포트폴리오'],['performance','⌁','성과'],['analysis','◇','분석'],['more','•••','더보기']];return `<nav class="nav">${tabs.map(([id,ico,label])=>`<button data-tab="${id}" class="${!state.detail&&state.tab===id?'active':''}"><span class="ico">${ico}</span><span>${label}</span></button>`).join('')}</nav>`}

function modal(html){let el=$('#modal');if(!el){el=document.createElement('div');el.id='modal';document.body.appendChild(el)}el.innerHTML=`<div class="modalback" data-close="1"></div><div class="modalcard">${html}</div>`;el.classList.add('show');el.querySelector('[data-close]')?.addEventListener('click',closeModal)}
function closeModal(){const m=$('#modal');if(m)m.classList.remove('show')}
function txDetail(id){const t=transactions().find(x=>x.id===id);if(!t)return;modal(`<div class="row between"><h3>거래 상세</h3><button class="iconbtn" data-close="1">×</button></div>${[['거래일',t.date],['종목',`${t.name} · ${t.symbol}`],['구분',t.type],['가격',t.price==null?'-':fmt(t.price)],['수량',t.qty==null?'-':fmt(t.qty)],['금액',money(t.amount)],['수수료',money(t.fee||0)],['세금',money(t.tax||0)],['통화',t.currency],['출처',t.source==='manual'?'사용자 직접 입력':'자동 수집']].map(([a,b])=>`<div class="summary-row"><span>${a}</span><strong>${b}</strong></div>`).join('')}`);$('#modal [data-close="1"]')?.addEventListener('click',closeModal)}
function addTxModal(){
  modal(`<div class="row between"><h3>수동 거래 추가</h3><button class="iconbtn" data-close="1">×</button></div><form id="txForm" class="formgrid"><label>날짜<input required type="date" name="date" value="${TODAY}"></label><label>종목명<input required name="name" placeholder="예: NVIDIA"></label><label>종목코드<input name="symbol" placeholder="예: NVDA"></label><label>구분<select name="type"><option>매수</option><option>매도</option><option>배당</option><option>입금</option><option>출금</option><option>수수료</option><option>세금</option><option>기타</option></select></label><label>금액 (원)<input required type="number" name="amount" step="1"></label><label>수량<input type="number" name="qty" step="any"></label><label>가격<input type="number" name="price" step="any"></label><button class="btn" type="submit">저장</button><div class="sub" id="txSaveMsg"></div></form>`);
  $('#modal [data-close="1"]')?.addEventListener('click',closeModal);
  $('#txForm').onsubmit=async e=>{
    e.preventDefault();const f=new FormData(e.target),type=f.get('type');let amount=Number(f.get('amount'));if(['매수','출금','수수료','세금'].includes(type)&&amount>0)amount=-amount;
    const draft={id:'m'+Date.now(),date:f.get('date'),name:f.get('name'),symbol:f.get('symbol')||'MANUAL',type,amount,qty:Number(f.get('qty'))||null,price:Number(f.get('price'))||null,fee:0,tax:0,currency:'KRW',source:'manual'};
    if(state.demo){state.manual.push(draft);saveManual();closeModal();render();return}
    const msg=$('#txSaveMsg');msg.textContent='DB에 저장 중…';
    try{
      const account=state.liveData?.accounts?.[0];if(!account)throw new Error('먼저 Live 계좌가 연결되어야 합니다.');
      const typeMap={'매수':'buy','매도':'sell','배당':'dividend','입금':'deposit','출금':'withdrawal','수수료':'fee','세금':'tax','기타':'other'};
      const dbType=typeMap[type]||'other';const symbol=String(f.get('symbol')||'').trim().toUpperCase();const sec=(state.liveData?.securities||[]).find(x=>String(x.symbol).toUpperCase()===symbol);
      if(['buy','sell','dividend'].includes(dbType)&&!sec)throw new Error('종목 거래는 먼저 동기화된 종목코드를 입력해 주세요.');
      const occurred=`${f.get('date')}T12:00:00+09:00`;
      await supabaseRest(state.config,state.session,'transactions',{method:'POST',headers:{Prefer:'return=representation'},body:{account_id:account.id,security_id:sec?.id||null,trade_at:occurred,type:dbType,quantity:draft.qty,price:draft.price,gross_amount:Math.abs(amount),fee:0,tax:0,net_amount:amount,currency:'KRW',source:'manual'}});
      if(dbType==='deposit'||dbType==='withdrawal')await supabaseRest(state.config,state.session,'cash_flows',{method:'POST',headers:{Prefer:'return=representation'},body:{account_id:account.id,occurred_at:occurred,type:dbType,amount,currency:'KRW',source:'manual'}});
      if(dbType==='dividend')await supabaseRest(state.config,state.session,'dividends',{method:'POST',headers:{Prefer:'return=representation'},body:{account_id:account.id,security_id:sec?.id||null,paid_at:occurred,gross_amount:Math.abs(amount),tax:0,net_amount:Math.abs(amount),currency:'KRW',source:'manual'}});
      await hydrateLive();closeModal();render();
    }catch(error){msg.textContent=error.message||'저장에 실패했습니다.'}
  }
}

function render(){
  document.getElementById('boot-status')?.remove();
  document.documentElement.dataset.theme=state.theme;document.documentElement.dataset.colors=state.colors==='global'?'global':'kr';
  let body=state.detail?detailPage(state.detail):state.tab==='home'?home():state.tab==='portfolio'?portfolio():state.tab==='performance'?performance():state.tab==='analysis'?analysis():more();
  $('#app').innerHTML=`<div class="app">${top()}<main class="content">${modeBanner()}${body}</main>${nav()}</div>`;bind();
}
function download(name,type,text){const b=new Blob([text],{type}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportBackup(){download(`my-portfolio-backup-${TODAY}.json`,'application/json',JSON.stringify({schemaVersion:1,exportedAt:new Date().toISOString(),mode:state.demo?'demo':'live',manualTransactions:state.manual,demo:{holdings:state.demo?holdings.map(({history,...x})=>x):undefined,dividends:state.demo?dividends:undefined}},null,2))}
function exportCsv(){const rows=[['date','symbol','name','type','amount','fee','tax','currency','source'],...transactions().map(t=>[t.date,t.symbol,t.name,t.type,t.amount,t.fee||0,t.tax||0,t.currency,t.source])];download(`my-portfolio-transactions-${TODAY}.csv`,'text/csv;charset=utf-8','\ufeff'+rows.map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\n'))}
async function hydrateLive(){
  if(state.demo||!state.session)return;
  try{
    const [accounts,securities,holdingsRows,transactionsRows,snapshots,performanceRows,dividendRows,priceRows,syncLogs]=await Promise.all([
      supabaseRest(state.config,state.session,'accounts?select=id,name,provider,base_currency,provider_account_ref&mode=eq.live&is_active=eq.true'),
      supabaseRest(state.config,state.session,'securities?select=id,symbol,name,market,asset_type,currency,sector,country'),
      supabaseRest(state.config,state.session,'holdings?select=id,account_id,security_id,as_of,quantity,avg_cost,market_price,market_value,unrealized_pnl,unrealized_pnl_rate,official_unrealized_pnl,currency,fx_rate_to_base,source&order=market_value.desc'),
      supabaseRest(state.config,state.session,'transactions?select=id,account_id,security_id,trade_at,type,quantity,price,gross_amount,fee,tax,net_amount,currency,realized_pnl,official_realized_pnl,source&order=trade_at.desc&limit=500'),
      supabaseRest(state.config,state.session,'daily_account_snapshots?select=account_id,snapshot_date,total_assets,cash,securities_value,invested_capital,unrealized_pnl,realized_pnl,dividends,interest,fees,taxes,total_pnl,external_flow&order=snapshot_date.asc&limit=5000'),
      supabaseRest(state.config,state.session,'portfolio_performance?select=account_id,performance_date,start_value,end_value,external_flow,daily_pnl,daily_return,twr_index&order=performance_date.asc&limit=5000'),
      supabaseRest(state.config,state.session,'dividends?select=id,account_id,security_id,paid_at,gross_amount,tax,net_amount,currency,fx_rate_to_base,source&order=paid_at.desc&limit=1000'),
      supabaseRest(state.config,state.session,'daily_security_prices?select=security_id,price_date,close,volume,currency,source&order=price_date.asc&limit=10000'),
      supabaseRest(state.config,state.session,'sync_logs?select=id,account_id,started_at,finished_at,status,scope,rows_read,rows_written,error_code,error_message&order=started_at.desc&limit=20'),
    ]);
    const securityMap=new Map(securities.map(x=>[x.id,x]));
    const pricesBySecurity=new Map();
    for(const row of priceRows){if(!pricesBySecurity.has(row.security_id))pricesBySecurity.set(row.security_id,[]);pricesBySecurity.get(row.security_id).push({date:row.price_date,close:Number(row.close),volume:Number(row.volume||0)})}
    state.liveData={accounts,securities,securityMap,holdings:holdingsRows,transactions:transactionsRows,snapshots,performance:performanceRows,dividends:dividendRows,pricesBySecurity,syncLogs};
    state.liveError=null;
  }catch(e){state.liveError=e.message;state.liveData=null}
}
function bind(){
  $('[data-close]')?.addEventListener('click',closeModal);$('#back')?.addEventListener('click',()=>{state.detail=null;render()});
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.detail=null;state.tab=b.dataset.tab;render()});
  document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{state.detail=null;state.tab=b.dataset.goto;render()});
  document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{state.period=b.dataset.period;render()});
  document.querySelectorAll('[data-perf]').forEach(b=>b.onclick=()=>{state.perfPeriod=b.dataset.perf;render()});
  document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.portfolioFilter=b.dataset.filter;render()});
  document.querySelectorAll('[data-detailrange]').forEach(b=>b.onclick=()=>{state.detailRange=b.dataset.detailrange;render()});
  document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{state.detail=b.dataset.detail;state.detailRange='1Y';render();scrollTo(0,0)});
  document.querySelectorAll('[data-tx]').forEach(b=>b.onclick=()=>txDetail(b.dataset.tx));
  const search=$('#search');if(search)search.oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#holdingList [data-search]').forEach(x=>x.style.display=x.dataset.search.includes(q)?'grid':'none')};
  const sort=$('#sort');if(sort)sort.onchange=e=>{state.sort=e.target.value;render()};
  $('#themeSwitch')?.addEventListener('click',()=>{state.theme=state.theme==='dark'?'light':'dark';localStorage.theme=state.theme;render()});
  $('#colors')?.addEventListener('click',()=>{state.colors=state.colors==='kr'?'global':'kr';localStorage.colors=state.colors;render()});
  $('#currency')?.addEventListener('click',()=>{state.currency=state.currency==='KRW'?'USD':'KRW';localStorage.currency=state.currency;render()});
  $('#compactSwitch')?.addEventListener('click',()=>{state.compact=!state.compact;localStorage.compact=state.compact;render()});
  $('#syncSwitch')?.addEventListener('click',()=>{state.autoSync=!state.autoSync;localStorage.autoSync=state.autoSync;render()});
  $('#appName')?.addEventListener('change',e=>{localStorage.appName=e.target.value.trim()||'My Portfolio';render()});
  $('#refresh')?.addEventListener('click',async()=>{const m=$('#syncMsg');m.textContent='동기화 중…';if(!state.demo)await hydrateLive();setTimeout(()=>{if($('#syncMsg'))$('#syncMsg').textContent=state.liveError?'일부 실패 · 마지막 정상 데이터를 유지합니다.':'정상 · 최신 데이터로 갱신했습니다.'},500)});
  $('#kbtest')?.addEventListener('click',async()=>{const m=$('#kbmsg');m.textContent='확인 중…';try{const r=await fetch(state.config?.kbStatusUrl || '/api/kb/status');if(!r.ok)throw new Error();const j=await r.json();m.textContent=j.mode==='configured'?'서버 Secret 등록됨 · 읽기 전용 연결 준비 완료':'아직 KB 서버 Secret이 등록되지 않았습니다.'}catch{m.textContent='로컬 Demo에서는 서버 API가 실행되지 않습니다.'}});
  $('#addTx')?.addEventListener('click',addTxModal);$('#exportJson')?.addEventListener('click',exportBackup);$('#exportCsv')?.addEventListener('click',exportCsv);
  $('#importJson')?.addEventListener('click',()=>$('#fileInput')?.click());$('#fileInput')?.addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const j=JSON.parse(await file.text());if(!Array.isArray(j.manualTransactions))throw new Error();state.manual=j.manualTransactions;saveManual();render()}catch{alert('지원되는 My Portfolio JSON 백업 파일이 아닙니다.')}});
  $('#resetData')?.addEventListener('click',()=>{if(confirm('수동으로 추가한 Demo 기록을 초기화할까요? 자동/샘플 데이터는 유지됩니다.')){state.manual=[];saveManual();render()}});
  $('#signout')?.addEventListener('click',signOut);
}

async function boot(){
  state.config=await getRuntimeConfig();state.session=await currentSession(state.config);
  if(state.config.requireAuth&&!state.session){renderLogin(state.config,{onDemo:()=>{state.demo=true;state.session=null;render()}});return}
  state.demo=!state.session;if(!state.demo)await hydrateLive();render();
}
boot().finally(()=>{if('serviceWorker' in navigator){const edge=globalThis.__MY_PORTFOLIO_EDGE__||{};navigator.serviceWorker.register(edge.serviceWorkerUrl||'/sw.js',{scope:edge.serviceWorkerScope||'/'}).catch(()=>{})}});

</script>
</body>
</html>
