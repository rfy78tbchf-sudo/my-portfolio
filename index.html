<style>

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo",sans-serif}.hidden{display:none!important}.shell{max-width:860px;margin:auto;min-height:100vh;padding-bottom:calc(82px + var(--safe))}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(100%,420px);background:var(--card);border:1px solid var(--line);border-radius:28px;padding:30px 22px;box-shadow:0 12px 40px #10182810;text-align:center}.mark{width:56px;height:56px;border-radius:18px;background:#11141a;color:white;display:grid;place-items:center;margin:auto;font-size:30px;font-weight:900}.login h1{margin:16px 0 7px;font-size:28px}.login p{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.55}.input{width:100%;border:1px solid var(--line);background:#fff;color:var(--text);padding:14px 15px;border-radius:15px;font-size:16px;outline:none}.btn{border:0;border-radius:14px;padding:13px 15px;font-weight:800;font-size:15px;background:#11141a;color:#fff}.btn.secondary{background:#eef1f4;color:#11141a}.full{width:100%}.gap{height:10px}.msg{min-height:20px;color:var(--muted);font-size:12px;margin-top:10px;line-height:1.4}.boot-ok{font-size:11px;color:#8b929d;margin-top:14px}.top{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(18px)}.brand{font-weight:900;font-size:18px}.badge{font-size:11px;font-weight:800;padding:6px 9px;border-radius:999px;background:#e9f7f2;color:#0b8d68}.content{padding:6px 14px 24px}.hero{padding:18px 4px 10px}.eyebrow{font-size:13px;font-weight:700;color:var(--muted)}.asset{font-size:38px;font-weight:900;letter-spacing:-1.4px;margin:5px 0}.pnl{font-weight:850}.up{color:var(--up)}.down{color:var(--down)}.periods{display:flex;gap:6px;overflow:auto;padding:10px 0}.chip{border:0;background:transparent;color:var(--muted);font-weight:800;padding:8px 11px;border-radius:999px;white-space:nowrap}.chip.active{background:#11141a;color:#fff}.grid{display:grid;gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 8px 28px #1018280a}.card h3{margin:0 0 14px;font-size:16px}.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.metric span{display:block}.metric .label{font-size:12px;color:var(--muted);margin-bottom:5px}.metric .value{font-weight:850;font-size:17px}.chart{height:170px;margin-top:8px}.chart svg{width:100%;height:100%}.line{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}.row strong{text-align:right}.sub{font-size:12px;color:var(--muted);margin-top:4px}.section{font-size:22px;font-weight:900;margin:10px 4px 14px}.bar{height:7px;background:#edf0f3;border-radius:999px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,860px);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px calc(8px + var(--safe));background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(20px);border-top:1px solid var(--line)}.nav button{border:0;background:transparent;color:var(--muted);padding:6px 2px;font-size:10px;font-weight:800}.nav button b{display:block;font-size:19px;margin-bottom:3px}.nav button.active{color:var(--text)}.notice{font-size:13px;color:var(--muted);line-height:1.55;border-left:3px solid var(--accent);padding-left:11px}.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{aspect-ratio:1;border-radius:8px;background:#eef1f4;display:grid;place-items:center;font-size:9px;color:var(--muted)}.day.p{background:#fbe8ea;color:var(--up)}.day.n{background:#e8eefc;color:var(--down)}.search{width:100%;border:1px solid var(--line);background:#fff;padding:12px 14px;border-radius:14px;font-size:15px}.settings .row{padding:14px 0}@media(min-width:720px){.content{padding:10px 24px}.desktop2{grid-template-columns:1.2fr .8fr}.asset{font-size:46px}}

<body>
<section id="login" class="login">

    <h1>My Portfolio</h1>

<script>
(function(){
  'use strict';
  var SUPABASE_URL='https://buimrsjowlmfkxxaithj.supabase.co';
  var SUPABASE_KEY='sb_publishable_PtqyNbOvFTVbPwtwZB6-rQ_bbzKHZfv';
  var currentTab='home';
  var period='1M';
  var holdings=[
    {name:'NVIDIA',symbol:'NVDA',value:47100000,ret:57.9,day:2.59,weight:21.6,sector:'반도체'},
    {name:'KODEX 미국AI전력핵심인프라',symbol:'487230',value:30470000,ret:21.6,day:1.12,weight:13.9,sector:'ETF'},

  function money(n){return Math.round(Number(n)||0).toLocaleString('ko-KR')+'원'}
  function pct(n){n=Number(n)||0;return (n>0?'+':'')+n.toFixed(2)+'%'}
  function cls(n){return Number(n)>=0?'up':'down'}
  function chart(values){var min=Math.min.apply(null,values),max=Math.max.apply(null,values),w=320,h=150,p=10,range=max-min||1;var pts=values.map(function(v,i){var x=p+i*(w-2*p)/(values.length-1),y=h-p-(v-min)/range*(h-2*p);return x.toFixed(1)+','+y.toFixed(1)}).join(' ');return '<div class="chart"><svg viewBox="0 0 '+w+' '+h+'"><polyline class="line" points="'+pts+'"/></svg></div>'}
  function metric(label,value,kind){return '<div class="metric"><span class="label">'+label+'</span><span class="value '+(kind||'')+'">'+value+'</span></div>'}
  function periods(){return '<div class="periods">'+['오늘','1W','1M','3M','YTD','1Y','ALL'].map(function(p){return '<button class="chip '+(period===p?'active':'')+'" data-period="'+p+'">'+p+'</button>'}).join('')+'</div>'}
  function home(){return '<section class="hero"><div class="eyebrow">총 자산</div><div class="asset">'+money(asset)+'</div><div class="pnl '+cls(todayPnl)+'">'+money(todayPnl)+' · '+pct(todayPct)+'</div>'+periods()+'</section><div class="grid desktop2"><section class="card"><h3>자산 추이</h3>'+chart(series)+'</section><section class="card"><h3>손익 구성</h3><div class="metric-grid">'+metric('평가손익',money(21830000),'up')+metric('실현손익',money(5320000),'up')+metric('배당',money(1840000),'up')+metric('수수료·세금',money(-1140000),'down')+'</div></section></div><section class="card" style="margin-top:12px"><h3>기여도 상위</h3>'+holdings.slice(0,4).map(function(h){return '<div class="row"><div><b>'+h.name+'</b><div class="sub">'+h.symbol+' · 비중 '+h.weight.toFixed(1)+'%</div></div><strong class="'+cls(h.day)+'">'+pct(h.day)+'</strong></div>'}).join('')+'</section>'}
  function portfolio(){return '<div class="section">포트폴리오</div><input id="search" class="search" placeholder="종목 검색"><section class="card" style="margin-top:12px">'+holdings.map(function(h){return '<div class="row holding" data-search="'+(h.name+' '+h.symbol).toLowerCase()+'"><div><b>'+h.name+'</b><div class="sub">'+h.symbol+' · '+h.sector+'</div><div class="bar"><i style="width:'+Math.min(100,h.weight*3)+'%"></i></div></div><strong>'+money(h.value)+'<div class="sub '+cls(h.ret)+'">'+pct(h.ret)+'</div></strong></div>'}).join('')+'</section>'}
  function performance(){var days=[.4,-.3,.7,.2,-.6,.9,.1,.3,.8,-.2,.5,1.1,-.4,.2,.6,-.1,.3,.9,.5,-.7,.2,.4,-.3,.8,.1,.6,-.2,.5,.85,.2,.1];return '<div class="section">성과</div>'+periods()+'<section class="card"><h3>1개월 투자성과</h3><div class="asset" style="font-size:31px">'+money(6140000)+'</div><div class="up" style="font-weight:850">+2.91%</div><div class="metric-grid" style="margin-top:14px">'+metric('실현손익',money(1540000),'up')+metric('평가손익 변화',money(4260000),'up')+metric('배당',money(410000),'up')+metric('비용',money(-70000),'down')+'</div></section><section class="card" style="margin-top:12px"><h3>Daily P&L · 9월</h3><div class="heat">'+days.map(function(v,i){return '<div class="day '+(v>0?'p':v<0?'n':'')+'">'+(i+1)+'</div>'}).join('')+'</div></section>'}
  function analysis(){var top5=holdings.slice(0,5).reduce(function(a,b){return a+b.weight},0);return '<div class="section">분석</div><div class="grid desktop2"><section class="card"><h3>집중도</h3><div class="row"><span>Top 5 집중도</span><strong>'+top5.toFixed(1)+'%</strong></div><div class="row"><span>최대 종목</span><strong>NVIDIA 21.6%</strong></div><div class="notice">집중도는 위험 정보이며 매수·매도 권고가 아닙니다.</div></section><section class="card"><h3>자산 지역</h3><div class="row"><span>미국</span><strong>57.8%</strong></div><div class="row"><span>한국</span><strong>42.2%</strong></div></section></div><section class="card" style="margin-top:12px"><h3>객관적 추세</h3><div class="row"><span>NVIDIA</span><strong class="up">상승</strong></div><div class="row"><span>삼성전자</span><strong>중립</strong></div><div class="row"><span>Apple</span><strong class="up">상승</strong></div></section>'}
  function more(){return '<div class="section">더보기</div><div class="grid settings"><section class="card"><h3>KB증권 연결</h3><div class="notice">현재는 Demo 화면입니다. App Key/App Secret은 이후 서버 보안 환경에만 저장하고 주문·취소·정정 API는 사용하지 않습니다.</div><div class="row"><span>자동 동기화</span><strong>준비 중</strong></div></section><section class="card"><h3>데이터</h3><div class="row"><span>장기 DB 저장</span><strong>Supabase</strong></div><div class="row"><span>일/주/월/연간/전체 손익</span><strong>설계 완료</strong></div></section></div>'}
  function render(){var content=document.getElementById('content');if(!content)return;content.innerHTML=currentTab==='home'?home():currentTab==='portfolio'?portfolio():currentTab==='performance'?performance():currentTab==='analysis'?analysis():more();renderNav();bindPage();window.scrollTo(0,0)}
  function renderNav(){var nav=document.getElementById('nav');nav.innerHTML=tabs.map(function(t){return '<button data-tab="'+t[0]+'" class="'+(currentTab===t[0]?'active':'')+'"><b>'+t[1]+'</b>'+t[2]+'</button>'}).join('');Array.prototype.forEach.call(nav.querySelectorAll('[data-tab]'),function(b){b.onclick=function(){currentTab=b.getAttribute('data-tab');render()}})}
  function bindPage(){Array.prototype.forEach.call(document.querySelectorAll('[data-period]'),function(b){b.onclick=function(){period=b.getAttribute('data-period');render()}});var s=document.getElementById('search');if(s)s.oninput=function(){var q=s.value.toLowerCase();Array.prototype.forEach.call(document.querySelectorAll('.holding'),function(x){x.style.display=x.getAttribute('data-search').indexOf(q)>=0?'flex':'none'})}}
  function showDemo(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render()}

  document.getElementById('demoBtn').onclick=showDemo;
  document.getElementById('loginForm').onsubmit=function(e){e.preventDefault();var email=document.getElementById('email').value.trim();var msg=document.getElementById('loginMsg');msg.textContent='로그인 링크 전송 중…';var redirect=location.href.split('#')[0];fetch(SUPABASE_URL+'/auth/v1/otp?redirect_to='+encodeURIComponent(redirect),{method:'POST',headers:{'content-type':'application/json','apikey':SUPABASE_KEY},body:JSON.stringify({email:email,create_user:true})}).then(function(r){if(!r.ok)throw new Error('로그인 링크 전송에 실패했습니다.');msg.textContent='메일함에서 My Portfolio 로그인 링크를 눌러주세요.'}).catch(function(err){msg.textContent=err&&err.message?err.message:'로그인 링크 전송에 실패했습니다.'})};
