  function livePerformance(){if(!live||!live.accounts.length)return '<div class="section">성과</div>'+empty('성과 데이터 없음','LIVE 계좌를 먼저 연결해 주세요.');var p=live.performance;if(!p||!p.ok)return '<div class="section">성과</div>'+periods()+empty('성과 데이터를 불러오지 못했습니다.','다시 시도해 주세요.');var realized=Number(p.realized_pnl||0),divs=Number(p.dividends_net||0),interest=Number(p.interest||0),otherFees=Number(p.other_fees||0),otherTaxes=Number(p.other_taxes||0),confirmed=realized+divs+interest-otherFees-otherTaxes;var tradeFees=Number(p.trade_fees_included_in_realized||0),tradeTaxes=Number(p.trade_taxes_included_in_realized||0),curUnreal=Number(p.current_unrealized_pnl||0);var title=p.return_ready?'기간 투자손익':'기간 확정손익';var headline=p.return_ready?Number(p.investment_pnl||0):confirmed;var ret=p.return_ready?'<div class="'+cls(p.return_pct)+'" style="font-weight:850">'+pct(p.return_pct)+'</div>':'<div class="sub">기간수익률은 일별 자산 스냅샷이 더 쌓인 뒤 계산됩니다. 현재 '+Number(p.snapshot_days||0)+'일치 보유.</div>';var range='<div class="sub">'+String(p.period_start||'')+' ~ '+String(p.period_end||'')+'</div>';var costs=tradeFees+tradeTaxes+Number(p.dividend_tax||0)+otherFees+otherTaxes;return '<div class="section">성과</div>'+periods()+'<section class="card"><h3>'+title+'</h3><div class="asset" style="font-size:31px">'+money(headline)+'</div>'+ret+range+'</section><section class="card" style="margin-top:12px"><h3>손익 구성</h3><div class="metric-grid">'+metric('기간 실현손익',money(realized),cls(realized))+metric('현재 평가손익',money(curUnreal),cls(curUnreal))+metric('기간 순배당',money(divs),cls(divs))+metric('기간 이자',money(interest),cls(interest))+'</div><div class="notice" style="margin-top:12px">실현손익은 KB가 제공한 값이며 해당 매매의 수수료·세금이 이미 반영되어 있습니다. 아래 비용을 다시 차감하지 않습니다.</div></section><section class="card" style="margin-top:12px"><h3>비용 · 현금흐름</h3><div class="metric-grid">'+metric('매매수수료 · 정보',money(-tradeFees),cls(-tradeFees))+metric('매매세금 · 정보',money(-tradeTaxes),cls(-tradeTaxes))+metric('기타수수료',money(-otherFees),cls(-otherFees))+metric('기타세   function analysis(){if(mode==='demo')return '<div class="section">분석</div>'+empty('Demo 분석','집중도·기술적 추세 화면은 Demo 데이터로 확인할 수 있습니다.');if(!live||!live.holdings.length)return '<div class="section">분석</div>'+empty('분석할 Live 데이터 없음','실제 보유종목이 들어오면 집중도와 객관적 기술 지표를 계산합니다.');var a=live.analysis;if(!a||!a.ok||!a.items)return '<div class="section">분석</div>'+empty('기술지표 데이터 없음','가격 데이터 동기화 후 다시 확인해 주세요.');var items=a.items||[];var top1=items.length?Number(items[0].weight_pct||0):0;var top3=items.slice(0,3).reduce(function(x,y){return x+Number(y.weight_pct||0)},0);var pos=items.filter(function(x){return Number(x.unrealized_pnl_krw||0)>0}).length;var trendClass=function(t){return t==='상승 추세'?'up':t==='하락 추세'?'down':'muted'};var cards=items.map(function(t){var macd=t.macd==null?'-':num(t.macd,2);var sig=t.macd_signal==null?'-':num(t.macd_signal,2);var rsi=t.rsi14==null?'-':num(t.rsi14,1);var dd=t.drawdown_from_52w_high_pct==null?'-':pct(t.drawdown_from_52w_high_pct);var vol=t.volatility_20d_annualized_pct==null?'-':num(t.volatility_20d_annualized_pct,1)+'%';var vr=t.volume_ratio_20d==null?'-':num(t.volume_ratio_20d,2)+'x';return '<section class="card analysis-card" data-search="'+((t.name||'')+' '+(t.symbol||'')).toLowerCase()+'" style="margin-top:12px"><div class="row"><div><b>'+t.name+'</b><div class="sub">'+t.symbol+' · 비중 '+num(t.weight_pct,1)+'% · '+String(t.price_date||'')+'</div></div><strong class="'+trendClass(t.trend)+'">'+t.trend+'</strong></div><div class="metric-grid">'+metric('현재가',price(t.close,t.currency),'')+metric('오늘',t.day_change_pct==null?'-':pct(t.day_change_pct),cls(t.day_change_pct))+metric('평가손익',money(t.unrealized_pnl_krw||0),cls(t.unrealized_pnl_krw))+metric('RSI14',rsi+' · '+t.rsi_state,'')+'</div><div class="row"><span>이동평균</span><strong>20 '+num(t.sma20,2)+' · 60 '+num(t.sma60,2)+'</strong></div><div class="row"><span>장기 이동평균</span><strong>120 '+num(t.sma120,2)+' · 200 '+num(t.sma200,2)+'</strong></div><div class="row"><span>MACD / Signal</span><str (){document.getElementById('kbAppSecret').value='';return edgeKb('token-test')}).then(function(){msg.textContent='연결 성공 · KB 토큰 발급 확인 · 주문 API 비활성';document.getElementById('kbAppKey').value=''}).catch(function(e){msg.textContent='연결 실패 · '+e.message;msg.className='status danger-text'}).finally(function(){save.disabled=false})};var test=document.getElementById('kbTestOnly');if(test)test.onclick=function(){var msg=document.getElementById('kbStatusText');test.disabled=true;msg.textContent='저장된 키로 KB 토큰 확인 중…';edgeKb('token-test').then(function(){msg.textContent='연결 성공 · KB 토큰 발급 확인 · 주문 API 비활성'}).catch(function(e){msg.textContent='연결 실패 · '+e.message;msg.className='status danger-text'}).finally(function(){test.disabled=false})};var sync=document.getElementById('kbSyncNow');if(sync)sync.onclick=function(){var msg=document.getElementById('kbStatusText');sync.disabled=true;msg.className='status';msg.textContent='KB 현재잔고 동기화 중…';edgeSync('sync-current').then(function(b){msg.textContent='현재잔고 '+Number(b.totalHoldings||0)+'종목 반영 · 당월 거래내역 동기화 중…';return edgeSync('sync-history-month',{month:kstMonth()})}).then(function(){msg.textContent='거래내역 반영 · 가격 데이터 동기화 중…';return edgeSync('sync-prices')}).then(function(){msg.textContent='동기화 완료 · 최신 데이터를 불러오는 중…';return loadLive()}).then(function(){render()}).catch(function(e){msg.textContent='동기화 실패 · '+e.message;msg.className='status danger-text'}).finally(function(){sync.disabled=false})}}
